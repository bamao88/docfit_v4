notes:
  - "u04 目录页末段（T:body:0054）锚定了学校的说明文本框（“以上说明参阅后请自行删除，包括本文本框”）。目录按原样保留，文本框未删除；需决定是否允许在保留单元中删除这一对象（Q4/Q6）。"
