notes:
  - "全文用“□”表示空格（标签字间距、段首缩进）。按 A⑧ 的三种原语只能删除，无法改写成空格：摘□要、致□□谢、学□□生的字间空格，以及摘要/关键词/正文段首的两格缩进，在干净模板中丢失。需决定是否允许“□→全角空格”这类替换原语。"
  - "u03 目录是手打文字（无目录域），按 Q6 未定前原样保留：示例条目与“目录基本格式：…”说明仍在。验收第一级要求目录保留生成机制，此处不满足，待 Q4/Q6。"
  - "u01 封面首段“附件1 封面基本格式：…”、u02/u09 中的格式说明，按原样保留规则未删除。"
  - "摘要在原件中与正文同属一个页面区域（Q5）。这里按内容拆成 u04 题目与中文摘要、u05 英文摘要、u06 正文、u07 参考文献、u08 致谢 五个单元（只拆对象清单，不拆 Word），待 Q5 确认。"
  - "正文有农理工科、文法经管类两套示例。原型取农理工科一套（数字编号）；文法经管类的同角色示例记为样式冲突，入库审核时确认。两套各级标题都是手打编号，原型无自动编号。"
  - "全文无分页符/分节符，各页靠空段分隔；原件未改动，这一点也保留。"
